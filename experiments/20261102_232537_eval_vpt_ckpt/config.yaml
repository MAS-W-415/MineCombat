# Stationary-target curriculum overlay.
#
# The zombie is directly in front of the player at 2.5-3.5 blocks and
# cannot move or attack (NoAI). All other settings are inherited from
# zombie_stage1.yaml.

base: zombie_stage1.yaml

zombie:
  min_distance: 2.5
  max_distance: 3.5
  spawn_height: 0.0
  randomize_player_yaw: false
  spawn_angle_deg: 90.0
  player_yaw: 0.0
  no_ai: true
