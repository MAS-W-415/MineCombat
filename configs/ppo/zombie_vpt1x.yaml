# Single-GPU PPO profile for VPT 1x.
#
# This is intentionally smaller than MineStudio's official config:
#   - one rollout worker
#   - eight environments
#   - batch size 1 per GPU
#   - context length 64
#
# Both the rollout worker and the trainer reserve 0.5 GPU so Ray can colocate
# them on one 8 GB card. If VRAM is still tight, set rollout num_gpus_per_worker
# to 0.25 and reduce num_envs to 4.

model:
  repo_id: CraftJarvis/MineStudio_VPT.foundation_model_1x

env:
  config: configs/env/zombie_stage1.yaml

trainer_name: PPOTrainer
detach_rollout_manager: true

rollout_config:
  num_rollout_workers: 1
  num_gpus_per_worker: 0.5
  num_cpus_per_worker: 4
  fragment_length: 256
  to_send_queue_size: 8
  worker_config:
    num_envs: 8
    batch_size: 4
    restart_interval: 3600
    video_fps: 20
    video_output_dir: output/videos
  replay_buffer_config:
    max_chunks: 4800
    max_reuse: 2
    max_staleness: 2
    fragments_per_report: 40
    fragments_per_chunk: 1
    database_config:
      path: output/replay_buffer_cache
      num_shards: 8
  episode_statistics_config: {}

train_config:
  num_workers: 1
  num_gpus_per_worker: 0.5
  num_iterations: 4000
  vf_warmup: 0
  learning_rate: 0.00002
  anneal_lr_linearly: false
  weight_decay: 0.04
  adam_eps: 1e-8
  batch_size_per_gpu: 1
  batches_per_iteration: 200
  gradient_accumulation: 10
  epochs_per_iteration: 1
  context_length: 64
  discount: 0.999
  gae_lambda: 0.95
  ppo_clip: 0.2
  clip_vloss: false
  max_grad_norm: 5
  zero_initial_vf: true
  ppo_policy_coef: 1.0
  ppo_vf_coef: 0.5
  kl_divergence_coef_rho: 0.2
  entropy_bonus_coef: 0.0
  coef_rho_decay: 0.9995
  log_ratio_range: 50
  normalize_advantage_full_batch: true
  use_normalized_vf: true
  num_readers: 2
  num_cpus_per_reader: 0.1
  prefetch_batches: 2
  save_interval: 10
  keep_interval: 40
  record_video_interval: 2
  enable_ref_update: true
  resume: null
  resume_optimizer: true
  save_path: output

logger_config:
  project: minecombat
  name: zombie_vpt1x
