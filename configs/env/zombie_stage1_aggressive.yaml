# R1 aggression reward overlay.
#
# The baseline reward made passive timeout cheap. R1 increases the value
# of engagement while keeping death costly. All environment/world settings
# are inherited from zombie_stage1.yaml.

base: zombie_stage1.yaml

reward:
  kill: 20.0
  death: -10.0
  damage_dealt: 0.02
  damage_taken: 0.05
  time: 0.002
  clip_min: -20.0
  clip_max: 40.0
