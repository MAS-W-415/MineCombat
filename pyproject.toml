[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minecombat"
version = "0.1.0"
description = "Curriculum reinforcement learning for Minecraft combat, from zombies to the Ender Dragon."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MineCombat contributors" }]
dependencies = [
    "MineStudio>=1.1.4",
    "numpy",
    "PyYAML",
    "gymnasium",
    "psutil",
    "torch>=2.0",
    "ray[default]",
    "wandb",
    "omegaconf",
    "hydra-core",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
